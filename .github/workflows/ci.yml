name: Firmware native tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install platformio==6.2.0
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Run portable firmware suite
        run: pio test -d firmware -e native
